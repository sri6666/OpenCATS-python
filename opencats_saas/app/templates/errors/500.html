{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-6 text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 6rem;"></i>
            <h1 class="display-4 mt-4">500</h1>
            <h2 class="mb-3">Internal Server Error</h2>
            <p class="lead text-muted mb-4">
                Something went wrong on our end. We've been notified and are working to fix it.
            </p>
            <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
